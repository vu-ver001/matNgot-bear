<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eceff1" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#263238"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 25px Arial, sans-serif; fill: #111827; }
      .laneTitle { font: 700 18px Arial, sans-serif; fill: #111827; }
      .boxText { font: 600 16px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .smallText { font: 500 14px Arial, sans-serif; fill: #374151; text-anchor: middle; }
      .edgeLabel { font: 600 14px Arial, sans-serif; fill: #111827; }
      .activity { fill: #ffffff; stroke: #263238; stroke-width: 1.6; rx: 12; filter: url(#shadow); }
      .systemActivity { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.6; rx: 12; filter: url(#shadow); }
      .externalActivity { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; rx: 12; filter: url(#shadow); }
      .staffActivity { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.6; rx: 12; filter: url(#shadow); }
      .flow { fill: none; stroke: #263238; stroke-width: 1.7; marker-end: url(#arrow); }
      .returnFlow { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#ffffff"/>
  <rect x="20" y="20" width="1560" height="1080" fill="url(#grid)" stroke="#111827" stroke-width="2"/>
  <text x="800" y="55" class="title" text-anchor="middle">Hình 2.1: Biểu đồ tiến trình nghiệp vụ mua hàng trực tuyến</text>

  <!-- Swimlanes -->
  <line x1="20" y1="78" x2="1580" y2="78" stroke="#111827" stroke-width="2"/>
  <line x1="400" y1="78" x2="400" y2="1100" stroke="#111827" stroke-width="2"/>
  <line x1="820" y1="78" x2="820" y2="1100" stroke="#111827" stroke-width="2"/>
  <line x1="1190" y1="78" x2="1190" y2="1100" stroke="#111827" stroke-width="2"/>
  <text x="210" y="106" class="laneTitle" text-anchor="middle">Khách hàng (Customer)</text>
  <text x="610" y="106" class="laneTitle" text-anchor="middle">Hệ thống Mật Ngọt Bear</text>
  <text x="1005" y="106" class="laneTitle" text-anchor="middle">Nhân viên (Staff)</text>
  <text x="1385" y="106" class="laneTitle" text-anchor="middle">Dịch vụ bên ngoài</text>
  <line x1="20" y1="120" x2="1580" y2="120" stroke="#111827" stroke-width="1.5"/>

  <!-- Start and customer browsing -->
  <circle cx="210" cy="150" r="14" fill="#111827"/>
  <path class="flow" d="M210 164 V190"/>
  <rect class="activity" x="100" y="190" width="220" height="58"/>
  <text x="210" y="219" class="boxText">Đăng nhập tài khoản</text>
  <path class="flow" d="M210 248 V276"/>
  <rect class="activity" x="85" y="276" width="250" height="66"/>
  <text x="210" y="300" class="boxText"><tspan x="210" dy="0">Tìm kiếm và xem</tspan><tspan x="210" dy="21">sản phẩm</tspan></text>
  <path class="flow" d="M335 309 H490"/>

  <!-- System presents catalog -->
  <rect class="systemActivity" x="490" y="276" width="240" height="66"/>
  <text x="610" y="300" class="boxText"><tspan x="610" dy="0">Hiển thị sản phẩm</tspan><tspan x="610" dy="21">và biến thể</tspan></text>
  <path class="flow" d="M610 342 V370 H335"/>
  <rect class="activity" x="85" y="370" width="250" height="66"/>
  <text x="210" y="394" class="boxText"><tspan x="210" dy="0">Chọn biến thể và</tspan><tspan x="210" dy="21">thêm vào giỏ</tspan></text>
  <path class="flow" d="M335 403 H515"/>

  <!-- Validate cart -->
  <polygon points="610,368 705,420 610,472 515,420" fill="#fff8db" stroke="#b7791f" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="610" y="411" class="boxText"><tspan x="610" dy="0">Đủ tồn kho</tspan><tspan x="610" dy="20">và hợp lệ?</tspan></text>
  <path class="returnFlow" d="M515 420 H455 V403 H335"/>
  <text x="462" y="408" class="edgeLabel">Không</text>
  <path class="flow" d="M610 472 V500 H335"/>
  <text x="625" y="491" class="edgeLabel">Có</text>

  <!-- Checkout -->
  <rect class="activity" x="75" y="500" width="270" height="78"/>
  <text x="210" y="526" class="boxText"><tspan x="210" dy="0">Nhập địa chỉ, voucher</tspan><tspan x="210" dy="21">và phương thức</tspan></text>
  <path class="flow" d="M345 539 H475"/>
  <rect class="systemActivity" x="475" y="500" width="270" height="78"/>
  <text x="610" y="526" class="boxText"><tspan x="610" dy="0">Kiểm tra dữ liệu</tspan><tspan x="610" dy="21">và tính đơn hàng</tspan></text>
  <path class="flow" d="M745 539 H1270"/>
  <rect class="externalActivity" x="1270" y="500" width="230" height="78"/>
  <text x="1385" y="526" class="boxText"><tspan x="1385" dy="0">GHN tính phí</tspan><tspan x="1385" dy="21">vận chuyển</tspan></text>
  <path class="flow" d="M1385 578 V610 H745"/>

  <!-- Create order and payment decision -->
  <rect class="systemActivity" x="475" y="610" width="270" height="78"/>
  <text x="610" y="636" class="boxText"><tspan x="610" dy="0">Tạo đơn, trừ kho</tspan><tspan x="610" dy="21">và ghi lịch sử</tspan></text>
  <path class="flow" d="M610 688 V716"/>
  <polygon points="610,716 710,768 610,820 510,768" fill="#fff8db" stroke="#b7791f" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="610" y="759" class="boxText"><tspan x="610" dy="0">Phương thức</tspan><tspan x="610" dy="20">thanh toán?</tspan></text>

  <!-- COD path -->
  <path class="flow" d="M710 768 H880"/>
  <text x="760" y="754" class="edgeLabel">COD</text>
  <rect class="staffActivity" x="880" y="730" width="250" height="76"/>
  <text x="1005" y="756" class="boxText"><tspan x="1005" dy="0">Xác nhận và</tspan><tspan x="1005" dy="21">chuẩn bị đơn</tspan></text>

  <!-- Online payment path -->
  <path class="flow" d="M610 820 V846 H1270"/>
  <text x="875" y="838" class="edgeLabel">Trực tuyến</text>
  <rect class="externalActivity" x="1270" y="810" width="230" height="72"/>
  <text x="1385" y="836" class="boxText"><tspan x="1385" dy="0">Xử lý thanh toán</tspan><tspan x="1385" dy="21">MoMo, VNPAY</tspan></text>
  <path class="flow" d="M1270 846 H745"/>
  <polygon points="610,846 700,894 610,942 520,894" fill="#fff8db" stroke="#b7791f" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="610" y="885" class="boxText"><tspan x="610" dy="0">Thanh toán</tspan><tspan x="610" dy="20">thành công?</tspan></text>
  <path class="returnFlow" d="M520 894 H390 V540 H345"/>
  <text x="402" y="880" class="edgeLabel">Không</text>
  <path class="flow" d="M700 894 H820 V840 H1005 V806"/>
  <text x="730" y="882" class="edgeLabel">Có</text>

  <!-- Fulfilment and completion -->
  <path class="flow" d="M1005 806 V947 H1270"/>
  <rect class="externalActivity" x="1270" y="914" width="230" height="66"/>
  <text x="1385" y="938" class="boxText"><tspan x="1385" dy="0">Vận chuyển</tspan><tspan x="1385" dy="21">và giao hàng</tspan></text>
  <path class="flow" d="M1270 947 H335"/>
  <rect class="activity" x="85" y="914" width="250" height="66"/>
  <text x="210" y="938" class="boxText"><tspan x="210" dy="0">Nhận hàng và</tspan><tspan x="210" dy="21">xác nhận</tspan></text>
  <path class="flow" d="M335 947 H485"/>
  <rect class="systemActivity" x="485" y="914" width="250" height="66"/>
  <text x="610" y="938" class="boxText"><tspan x="610" dy="0">Cập nhật đơn</tspan><tspan x="610" dy="21">hoàn thành</tspan></text>
  <path class="flow" d="M610 980 V1010 H335"/>
  <rect class="activity" x="85" y="1010" width="250" height="58"/>
  <text x="210" y="1039" class="boxText">Đánh giá sản phẩm</text>
  <path class="flow" d="M210 1068 V1080"/>
  <circle cx="210" cy="1084" r="11" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <circle cx="210" cy="1084" r="6" fill="#111827"/>
</svg>
